<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - AI Customer Support Agent</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; background: var(--bg-page);">

  <header class="navbar">
    <a href="/index.html" class="nav-brand" style="text-decoration:none;">
      <span>🤖</span>
      <span>Aegis<span style="color:var(--accent-cyan);">Support</span></span>
    </a>
    <div class="nav-links">
      <a href="/index.html" class="nav-link">Home</a>
      <a href="/login.html" class="nav-link">Sign In</a>
    </div>
  </header>

  <main style="flex:1; display:flex; align-items:center; justify-content:center; padding: 2.5rem 1rem;">
    <div class="card" style="max-width: 500px; width: 100%; padding: 2.25rem; box-shadow: var(--shadow-xl);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h2 style="font-size: 1.75rem; font-weight: 800; color: var(--navy-900);">Create an Account</h2>
        <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.35rem;">
          Join our enterprise customer support platform
        </p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="full_name">Full Name</label>
          <input type="text" id="full_name" class="form-control" placeholder="Jane Doe" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Work or Personal Email</label>
          <input type="email" id="email" class="form-control" placeholder="jane@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Phone Number (Optional)</label>
          <input type="tel" id="phone" class="form-control" placeholder="+1-800-555-0199">
        </div>

        <div class="form-group">
          <label class="form-label" for="role">Registering As</label>
          <select id="role" class="form-control" onchange="toggleAgentDept(this.value)">
            <option value="customer" selected>Customer</option>
            <option value="agent">Support Agent</option>
          </select>
        </div>

        <div class="form-group" id="dept-group" style="display:none;">
          <label class="form-label" for="department">Assigned Department</label>
          <select id="department" class="form-control">
            <option value="General Support">General Support</option>
            <option value="Billing & Finance">Billing & Finance</option>
            <option value="Technical Support">Technical Support</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" required>
        </div>

        <button type="submit" id="reg-btn" class="btn btn-primary btn-block" style="padding: 0.8rem; margin-top: 0.5rem;">
          Complete Registration
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
        Already have an account? <a href="/login.html" style="font-weight: 600;">Sign in</a>
      </div>
    </div>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    function toggleAgentDept(role) {
      document.getElementById("dept-group").style.display = role === "agent" ? "block" : "none";
    }

    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const full_name = document.getElementById("full_name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const role = document.getElementById("role").value;
      const department = document.getElementById("department").value;
      const password = document.getElementById("password").value;
      const btn = document.getElementById("reg-btn");

      try {
        btn.innerText = "Creating account...";
        btn.disabled = true;

        const res = await Auth.register({ full_name, email, phone, role, department, password });
        showToast("Registration successful!", "success");

        setTimeout(() => {
          if (res.user.role === "agent") {
            window.location.href = "/agent_dashboard.html";
          } else {
            window.location.href = "/customer_dashboard.html";
          }
        }, 500);

      } catch (err) {
        showToast(err.message, "error");
        btn.innerText = "Complete Registration";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
